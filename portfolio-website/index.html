    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Set the theme before first paint so a dark visit never flashes white:
         the visitor's saved choice, else their system setting. src/theme.js
         keeps it in sync after load. -->
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0d1219" : "#ffffff";
      })();
    </script>
